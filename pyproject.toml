[project]
name = "hse-password-manager"
version = "0.1.0"
description = "Simple password manager"
requires-python = ">=3.15"
dependencies = [
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "password_manager"

[tool.pytest.ini_options]
strict = true
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--import-mode=importlib",
]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.mypy]
strict = true
extra_checks = true
show_error_codes = true
show_error_code_links = true
show_column_numbers = true
pretty = true
